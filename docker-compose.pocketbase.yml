services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: janflow_pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
    environment:
      - PB_ENCRYPTION_KEY= # Opcional: chave para criptografia de dados sensíveis
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pb_data:
